<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MarketBrief">
<meta name="theme-color" content="#08090c">
<title>MarketBrief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

:root {
  --bg:   #08090c;
  --bg1:  #0f1116;
  --bg2:  #161920;
  --bg3:  #1c2029;
  --border: rgba(255,255,255,0.07);
  --gold:  #c9a96e;
  --green: #4ecba0;
  --red:   #e05757;
  --yellow:#e8c547;
  --text:  #cdd1de;
  --muted: #505672;
  --white: #eef0f7;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bot: env(safe-area-inset-bottom, 20px);
  --safe-l:   env(safe-area-inset-left, 0px);
  --safe-r:   env(safe-area-inset-right, 0px);
}

html { font-size: 16px; -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overflow-x: hidden;
}

/* grain overlay */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  opacity: 0.02;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ── KEY SCREEN ── */
#key-screen {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; min-height: -webkit-fill-available;
  padding: 40px 24px; gap: 28px;
}
.key-logo {
  font-family: 'Libre Baskerville', serif;
  font-size: 38px; font-weight: 400;
  color: var(--white); letter-spacing: -0.5px; line-height: 1;
}
.key-logo em { color: var(--gold); font-style: italic; }
.key-sub {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--muted);
  letter-spacing: 2.5px; text-transform: uppercase; text-align: center;
}
.key-form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
.key-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase;
}
#api-key-input {
  background: var(--bg2); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px; padding: 16px 18px;
  color: var(--white); font-family: 'DM Mono', monospace; font-size: 13px;
  width: 100%; outline: none; -webkit-appearance: none;
  transition: border-color 0.2s;
}
#api-key-input:focus { border-color: var(--gold); }
#api-key-input::placeholder { color: var(--muted); }
.btn-primary {
  background: var(--gold); color: #08090c;
  border: none; border-radius: 14px;
  padding: 17px; font-family: 'Barlow', sans-serif;
  font-size: 15px; font-weight: 600; letter-spacing: 0.2px;
  cursor: pointer; -webkit-appearance: none;
  transition: transform 0.1s, opacity 0.1s;
}
.btn-primary:active { transform: scale(0.97); opacity: 0.9; }
.hint-link {
  font-family: 'DM Mono', monospace; font-size: 10px;
  color: var(--gold); text-decoration: none;
  text-align: center; letter-spacing: 0.5px;
}

/* ── LOADING SCREEN ── */
#loading-screen {
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; gap: 24px;
}
.spinner-ring { width: 54px; height: 54px; position: relative; }
.spinner-ring::before, .spinner-ring::after {
  content: ''; position: absolute; border-radius: 50%; border: 1.5px solid transparent;
}
.spinner-ring::before { inset: 0; border-top-color: var(--gold); animation: spin 1s linear infinite; }
.spinner-ring::after  { inset: 9px; border-top-color: var(--green); animation: spin 1.4s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-label {
  font-family: 'Libre Baskerville', serif;
  font-size: 21px; font-weight: 400; color: var(--white);
}
.loading-sub {
  font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted);
  letter-spacing: 2px; text-transform: uppercase;
  animation: pulse 2s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

/* ── ERROR SCREEN ── */
#error-screen {
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; gap: 20px; padding: 32px;
}
.err-icon { font-size: 42px; }
.err-title {
  font-family: 'Libre Baskerville', serif;
  font-size: 22px; color: var(--white);
}
.err-msg {
  font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted);
  text-align: left; line-height: 1.7;
  width: 100%; max-width: 320px;
  background: var(--bg2); border: 1px solid rgba(224,87,87,0.2);
  border-radius: 12px; padding: 14px;
  white-space: pre-wrap; word-break: break-all;
  max-height: 180px; overflow-y: auto;
}
.btn-retry {
  background: var(--gold); color: #08090c; border: none;
  border-radius: 14px; padding: 15px 32px;
  font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600;
  cursor: pointer; -webkit-appearance: none;
}
.btn-key-reset {
  background: none; border: none;
  font-family: 'DM Mono', monospace; font-size: 10px;
  color: var(--muted); cursor: pointer; letter-spacing: 0.5px;
  margin-top: -8px;
}

/* ── DASHBOARD ── */
#dashboard {
  display: none;
  padding-bottom: calc(var(--safe-bot) + 48px);
  padding-left: calc(var(--safe-l) + 16px);
  padding-right: calc(var(--safe-r) + 16px);
}

/* sticky topbar */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(8,9,12,0.9);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  margin: 0 -16px; padding: 0 16px;
  padding-top: var(--safe-top);
}
.topbar-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0 12px;
}
.topbar-eyebrow {
  font-family: 'DM Mono', monospace; font-size: 8px;
  color: var(--muted); letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 3px;
}
.topbar-title {
  font-family: 'Libre Baskerville', serif;
  font-size: 22px; font-weight: 400; color: var(--white);
  line-height: 1; letter-spacing: -0.3px;
}
.topbar-title em { color: var(--gold); font-style: italic; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
#hdr-sentiment {
  font-family: 'DM Mono', monospace;
  font-size: 11px; font-weight: 500; letter-spacing: 0.5px;
}
.refresh-btn {
  width: 36px; height: 36px; flex-shrink: 0;
  background: var(--bg2); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; color: var(--gold); font-size: 16px;
  cursor: pointer; -webkit-appearance: none;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s;
}
.refresh-btn:active { opacity: 0.5; }
.refresh-btn:disabled { opacity: 0.3; }

/* content stream */
.stream {
  padding-top: 16px;
  display: flex; flex-direction: column; gap: 12px;
}

/* date line */
#hdr-date {
  font-family: 'DM Mono', monospace; font-size: 9px;
  color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase;
  padding-top: 2px;
}

/* alert pill */
.alert {
  background: rgba(224,87,87,0.08); border: 1px solid rgba(224,87,87,0.28);
  border-radius: 12px; padding: 11px 14px;
  display: flex; align-items: flex-start; gap: 8px;
  font-family: 'DM Mono', monospace; font-size: 10px;
  color: var(--red); line-height: 1.5; letter-spacing: 0.2px;
}
.alert span:first-child { flex-shrink: 0; margin-top: 1px; }

/* cards */
.card {
  background: var(--bg1); border: 1px solid var(--border);
  border-radius: 18px; overflow: hidden;
}
.card-title {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px 0;
  font-family: 'DM Mono', monospace; font-size: 8px;
  color: var(--muted); letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 2px;
}
.card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.card-body { padding: 4px 16px 14px; }

/* sentiment bar */
.sent-wrap { padding: 14px 16px; }
.sent-bar-wrap { padding: 0; background: none; border: none; border-radius: 0; }
.sent-bar-labels {
  display: flex; justify-content: space-between;
  margin-bottom: 10px;
}
.sent-bar-labels span, .sent-bar-score {
  font-family: 'DM Mono', monospace; font-size: 9px;
  color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
}
.sent-bar-track {
  height: 5px; background: var(--bg3);
  border-radius: 3px; overflow: hidden; margin-bottom: 7px;
}
.sent-bar-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #6b0f0f, var(--red) 30%, var(--yellow) 65%, var(--green));
  transition: width 1.2s cubic-bezier(0.23,1,0.32,1);
}
.sent-bar-ends {
  display: flex; justify-content: space-between;
}
.sent-bar-ends span {
  font-family: 'DM Mono', monospace; font-size: 8px; color: var(--muted);
}

/* index rows */
.idx-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 0; border-bottom: 1px solid var(--border); min-height: 52px;
}
.idx-row:last-child { border-bottom: none; }
.idx-name { font-size: 14px; font-weight: 500; color: var(--white); line-height: 1.2; }
.idx-sub  { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); margin-top: 2px; }
.idx-right { text-align: right; flex-shrink: 0; padding-left: 12px; }
.idx-price { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--white); }
.idx-chg   { font-family: 'DM Mono', monospace; font-size: 11px; margin-top: 2px; }

/* crypto — list rows instead of 3-col grid */
.crypto-grid { display: flex; flex-direction: column; }
.crypto-cell {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.crypto-cell:last-child { border-bottom: none; }
.crypto-icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--bg3); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500;
  color: var(--gold); text-align: center; letter-spacing: 0; line-height: 1.2;
}
.crypto-mid { flex: 1; min-width: 0; }
.crypto-sym  { font-size: 14px; font-weight: 500; color: var(--white); }
.crypto-note { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); margin-top: 2px; }
.mini-bar { height: 2px; background: var(--bg3); border-radius: 1px; margin-top: 5px; overflow: hidden; }
.mini-fill { height: 100%; border-radius: 1px; }
.crypto-right { text-align: right; flex-shrink: 0; }
.crypto-price { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--white); }
.crypto-chg   { font-family: 'DM Mono', monospace; font-size: 11px; margin-top: 2px; }

/* stocks grid */
.stocks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stock-cell {
  background: var(--bg2); border-radius: 12px;
  padding: 12px 14px; min-height: 58px;
  display: flex; flex-direction: column; justify-content: center; gap: 4px;
}
.stock-name { font-size: 13px; font-weight: 500; color: var(--text); }
.stock-chg  { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; }

/* macro list */
.macro-list { list-style: none; }
.macro-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 0; border-bottom: 1px solid var(--border); min-height: 44px;
}
.macro-item:last-child { border-bottom: none; }
.macro-key { font-size: 13px; color: var(--muted); }
.macro-val { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; text-align: right; }

/* tags */
.tag-cloud { display: flex; flex-wrap: wrap; gap: 7px; }
.tag { font-family: 'DM Mono', monospace; font-size: 10px; padding: 6px 11px; border-radius: 20px; letter-spacing: 0.2px; line-height: 1; }
.tag-pos { color: var(--green); border: 1px solid rgba(78,203,160,0.3); background: rgba(78,203,160,0.06); }
.tag-neg { color: var(--red);   border: 1px solid rgba(224,87,87,0.3);  background: rgba(224,87,87,0.06); }
.tag-neu { color: var(--yellow);border: 1px solid rgba(232,197,71,0.3); background: rgba(232,197,71,0.06); }

/* risk/opp */
.ro-label {
  font-family: 'DM Mono', monospace; font-size: 8px;
  letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 9px;
}
.ro-section + .ro-section { margin-top: 16px; }

/* recommendation */
.rec-box {
  background: linear-gradient(145deg, rgba(224,87,87,0.06), rgba(201,169,110,0.03));
  border: 1px solid rgba(224,87,87,0.22);
  border-radius: 18px; padding: 20px;
}
.rec-title {
  font-family: 'DM Mono', monospace; font-size: 8px;
  color: var(--red); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px;
}
.rec-text {
  font-family: 'Libre Baskerville', serif;
  font-size: 16px; font-weight: 400;
  color: var(--white); line-height: 1.7;
}
.rec-text strong { color: var(--gold); font-weight: 700; }

/* footer */
.footer-updated {
  font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted);
  text-align: center; margin-bottom: 4px;
}
.footer-legal {
  font-family: 'DM Mono', monospace; font-size: 8px;
  color: rgba(80,86,114,0.45); letter-spacing: 0.5px; text-align: center;
}
.sep { height: 1px; background: var(--border); margin: 4px 0 12px; }

/* install banner */
#install-banner {
  display: none; position: fixed;
  bottom: calc(var(--safe-bot) + 12px); left: 16px; right: 16px;
  background: var(--bg2); border: 1px solid rgba(201,169,110,0.35);
  border-radius: 16px; padding: 14px 16px; z-index: 200;
  box-shadow: 0 12px 40px rgba(0,0,0,0.7);
}
.install-inner { display: flex; align-items: center; gap: 12px; }
.install-icon  { font-size: 26px; flex-shrink: 0; }
.install-text  { flex: 1; }
.install-text strong { display: block; color: var(--white); font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.install-text span   { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); }
.install-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px; flex-shrink: 0; }

/* helpers */
.pos { color: var(--green); }
.neg { color: var(--red); }
.neu { color: var(--yellow); }

/* animations */
@keyframes riseUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.card, .rec-box, .alert { opacity: 0; animation: riseUp 0.45s ease forwards; }
.card:nth-child(1){animation-delay:0.05s} .card:nth-child(2){animation-delay:0.10s}
.card:nth-child(3){animation-delay:0.15s} .card:nth-child(4){animation-delay:0.20s}
.card:nth-child(5){animation-delay:0.25s} .card:nth-child(6){animation-delay:0.30s}
.card:nth-child(7){animation-delay:0.35s} .card:nth-child(8){animation-delay:0.40s}
.rec-box{animation-delay:0.45s} .alert{animation-delay:0.02s}

</head>
<body>

<!-- KEY SCREEN -->
<div id="key-screen">
  <div class="key-logo">Markt<em>Brief</em></div>
  <div class="key-sub">KI-gestützte Marktanalyse</div>
  <div class="key-form">
    <div class="key-lbl">Anthropic API Key</div>
    <input type="password" id="api-key-input" placeholder="sk-ant-api03-…"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="key-form">
    <div class="key-lbl">Finnhub API Key (für echte Kurse)</div>
    <input type="password" id="finnhub-key-input" placeholder="z.B. cXXXXXXXXXXXXXXXX"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button class="btn-primary" onclick="saveKey()">Starten →</button>
  </div>
  <a class="hint-link" href="https://console.anthropic.com/" target="_blank">Anthropic Key → console.anthropic.com</a>
  <a class="hint-link" href="https://finnhub.io/register" target="_blank">Finnhub Key (gratis) → finnhub.io/register</a>
</div>

<!-- LOADING SCREEN -->
<div id="loading-screen">
  <div class="spinner-ring"></div>
  <div class="loading-label">Analyse läuft</div>
  <div class="loading-sub">Märkte werden ausgewertet</div>
</div>

<!-- ERROR SCREEN -->
<div id="error-screen">
  <div class="err-icon">⚡</div>
  <div class="err-title">Verbindungsfehler</div>
  <div class="err-msg" id="error-msg">Unbekannter Fehler</div>
  <button class="btn-retry" onclick="retryFetch()">Erneut versuchen</button>
  <button class="btn-key-reset" onclick="resetKey()">API Key ändern</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

  <!-- Sticky Topbar -->
  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="topbar-eyebrow">Daily Market Brief</div>
        <div class="topbar-title">Markt<em>analyse</em></div>
      </div>
      <div class="topbar-right">
        <div id="hdr-sentiment">—</div>
        <button class="refresh-btn" id="refresh-btn">↺</button>
      </div>
    </div>
  </div>

  <div class="stream">

    <div id="hdr-date"></div>

    <!-- Alert -->
    <div class="alert" id="alert-banner" style="display:none">
      <span>⚠</span><span id="alert-text"></span>
    </div>

    <!-- Sentiment -->
    <div class="card">
      <div class="sent-wrap">
        <div class="sent-bar-labels">
          <span>Gesamtstimmung</span>
          <span id="score-label">— / 100</span>
        </div>
        <div class="sent-bar-track">
          <div class="sent-bar-fill" id="sent-fill" style="width:0%"></div>
        </div>
        <div class="sent-bar-ends">
          <span>Bearish</span><span>Neutral</span><span>Bullish</span>
        </div>
      </div>
    </div>

    <!-- US Markets -->
    <div class="card">
      <div class="card-title">🇺🇸 US-Märkte</div>
      <div class="card-body" id="us-markets"></div>
    </div>

    <!-- EU Markets -->
    <div class="card">
      <div class="card-title">🌍 Europa &amp; Rohstoffe</div>
      <div class="card-body" id="eu-markets"></div>
    </div>

    <!-- Crypto -->
    <div class="card">
      <div class="card-title">₿ Krypto</div>
      <div class="card-body">
        <div class="crypto-grid" id="crypto-grid"></div>
      </div>
    </div>

    <!-- Stocks -->
    <div class="card">
      <div class="card-title">📊 Einzelwerte</div>
      <div class="card-body">
        <div class="stocks-grid" id="stocks-grid"></div>
      </div>
    </div>

    <!-- Macro -->
    <div class="card">
      <div class="card-title">🌐 Makro</div>
      <div class="card-body">
        <ul class="macro-list" id="macro-list"></ul>
      </div>
    </div>

    <!-- Topics -->
    <div class="card">
      <div class="card-title">🔥 Top-Themen</div>
      <div class="card-body" style="padding-top:10px">
        <div class="tag-cloud" id="topics-cloud"></div>
      </div>
    </div>

    <!-- Risks & Opps -->
    <div class="card">
      <div class="card-title">⚖ Risiken &amp; Chancen</div>
      <div class="card-body" style="padding-top:12px">
        <div class="ro-section">
          <div class="ro-label neg">Risiken</div>
          <div class="tag-cloud" id="risks-cloud"></div>
        </div>
        <div class="ro-section">
          <div class="ro-label pos">Chancen</div>
          <div class="tag-cloud" id="opps-cloud"></div>
        </div>
      </div>
    </div>

    <!-- ═══ PORTFOLIO ═══ -->

    <!-- Disclaimer -->
    <div class="disclaimer">
      <span>ⓘ</span>
      <span>SIMULATION / PAPER-TRADING — Dies ist ein fiktives Musterportfolio zu Demonstrationszwecken. Keine Anlageberatung. Echtes Investieren erfolgt auf eigenes Risiko.</span>
    </div>

    <!-- Portfolio value hero -->
    <div class="pf-hero">
      <div class="pf-hero-label">Musterportfolio · 10.000 € Start</div>
      <div class="pf-value" id="pf-value">—</div>
      <div class="pf-delta" id="pf-delta"></div>
      <div class="alloc-bar" id="pf-alloc" style="margin-top:14px"></div>
      <div class="pf-sub">
        <span id="pf-since">—</span>
        <span id="pf-cash">—</span>
      </div>
    </div>

    <!-- Holdings -->
    <div class="card">

<script>
// ── Constants ─────────────────────────────────────────
const API_ENDPOINT = 'https://marketbriefproxy.loysl61.workers.dev/';
const FINNHUB_BASE = 'https://finnhub.io/api/v1';
const KEY_STORAGE  = 'mb_api_key';
const FINNHUB_KEY_STORAGE = 'mb_finnhub_key';
const CACHE_KEY    = 'mb_cached_brief';
const CACHE_TS_KEY = 'mb_cache_ts';
const PORTFOLIO_KEY = 'mb_portfolio';
const CACHE_TTL_MS = 4 * 60 * 60 * 1000; // 4 hours

// Portfolio universe — real tradeable symbols via Finnhub
// stocks/ETFs use plain symbols; crypto uses BINANCE: prefix
const UNIVERSE = [
  { sym: 'NVDA',  finnhub: 'NVDA',                name: 'NVIDIA',         cls: 'Aktie · AI',     badge: 'NVDA' },
  { sym: 'MSFT',  finnhub: 'MSFT',                name: 'Microsoft',      cls: 'Aktie · Tech',   badge: 'MSFT' },
  { sym: 'VOO',   finnhub: 'VOO',                 name: 'S&P 500 ETF',    cls: 'ETF · Breit',    badge: 'VOO' },
  { sym: 'BTC',   finnhub: 'BINANCE:BTCUSDT',     name: 'Bitcoin',        cls: 'Krypto',         badge: 'BTC' },
  { sym: 'ETH',   finnhub: 'BINANCE:ETHUSDT',     name: 'Ethereum',       cls: 'Krypto',         badge: 'ETH' },
];

// ── Screens ───────────────────────────────────────────
function show(name) {
  ['key-screen','loading-screen','error-screen','dashboard'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
  const map = { key:'key-screen', loading:'loading-screen', error:'error-screen', dash:'dashboard' };
  const target = document.getElementById(map[name]);
  if (target) target.style.display = (name === 'dash') ? 'block' : 'flex';
}

// Global safety net — any uncaught error shows a message instead of a black screen
window.addEventListener('error', (e) => {
  const em = document.getElementById('error-msg');
  if (em) {
    em.textContent = 'Fehler: ' + (e.message || 'unbekannt') + '\n\nZeile: ' + (e.lineno||'?') + '\nDatei: ' + ((e.filename||'').split('/').pop());
    show('error');
  }
});
window.addEventListener('unhandledrejection', (e) => {
  const em = document.getElementById('error-msg');
  if (em) {
    em.textContent = 'Promise-Fehler: ' + (e.reason?.message || String(e.reason));
    show('error');
  }
});

// ── State (filled each load) ──────────────────────────
let currentPrices = {};   // sym -> {price, changePct, prevClose}
let currentEURUSD = 1.08; // fallback
let pendingTrades = [];   // trade suggestions for this session

// ── Init ──────────────────────────────────────────────
window.addEventListener('load', () => {
  const key = localStorage.getItem(KEY_STORAGE);
  if (!key) { show('key'); return; }
  loadBrief();
  maybeShowInstallBanner();
});

// ── Key handling ──────────────────────────────────────
function saveKey() {
  const v = document.getElementById('api-key-input').value.trim();
  if (!v.startsWith('sk-ant')) {
    alert('Bitte einen gültigen Anthropic API Key eingeben (beginnt mit sk-ant)');
    return;
  }
  localStorage.setItem(KEY_STORAGE, v);
  const fh = document.getElementById('finnhub-key-input').value.trim();
  if (fh) localStorage.setItem(FINNHUB_KEY_STORAGE, fh);
  loadBrief();
}
function resetKey() {
  localStorage.removeItem(KEY_STORAGE);
  localStorage.removeItem(CACHE_KEY);
  localStorage.removeItem(CACHE_TS_KEY);
  show('key');
}

// ── Cache helpers ─────────────────────────────────────
function getCached() {
  try {
    const ts = parseInt(localStorage.getItem(CACHE_TS_KEY) || '0');
    if (Date.now() - ts > CACHE_TTL_MS) return null;
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function setCache(data) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    localStorage.setItem(CACHE_TS_KEY, String(Date.now()));
  } catch {}
}

// ── FINNHUB: fetch real quotes ────────────────────────
async function fetchQuote(finnhubSym, fhKey) {
  const url = `${FINNHUB_BASE}/quote?symbol=${encodeURIComponent(finnhubSym)}&token=${fhKey}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Finnhub ${r.status} für ${finnhubSym}`);
  const d = await r.json();
  // d.c = current, d.pc = previous close, d.dp = change percent
  return { price: d.c || 0, prevClose: d.pc || 0, changePct: d.dp || 0 };
}

async function fetchAllPrices(fhKey) {
  const prices = {};
  // Sequential to respect rate limits (5 symbols, well under 60/min)
  for (const u of UNIVERSE) {
    try {
      const q = await fetchQuote(u.finnhub, fhKey);
      prices[u.sym] = q;
    } catch (e) {
      prices[u.sym] = null; // mark failed
    }
  }
  // EUR/USD for currency conversion
  try {
    const fx = await fetchQuote('OANDA:EUR_USD', fhKey);
    if (fx.price > 0) currentEURUSD = fx.price;
  } catch {}
  return prices;
}

// ── PORTFOLIO: storage ────────────────────────────────
function getPortfolio() {
  try {
    const raw = localStorage.getItem(PORTFOLIO_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function savePortfolio(pf) {
  try { localStorage.setItem(PORTFOLIO_KEY, JSON.stringify(pf)); } catch {}
}

// Build the INITIAL portfolio (first run) — equal-ish growth allocation
// All values stored in EUR. Holdings stored as units (shares/coins).
function createInitialPortfolio() {
  // Growth-oriented target allocation (sums to 1.0)
  const targetAlloc = {
    'NVDA': 0.25,
    'MSFT': 0.20,
    'VOO':  0.25,
    'BTC':  0.20,
    'ETH':  0.10,
  };
  const startCapitalEUR = 10000;
  const holdings = {};
  // Convert each EUR slice into units using current USD price -> EUR
  for (const u of UNIVERSE) {
    const q = currentPrices[u.sym];
    const allocEUR = startCapitalEUR * (targetAlloc[u.sym] || 0);
    if (q && q.price > 0) {
      const priceEUR = q.price / currentEURUSD;
      holdings[u.sym] = {
        units: allocEUR / priceEUR,
        avgCostEUR: priceEUR,        // cost basis per unit
        targetAlloc: targetAlloc[u.sym]
      };
    } else {
      holdings[u.sym] = { units: 0, avgCostEUR: 0, targetAlloc: targetAlloc[u.sym] };
    }
  }
  const pf = {
    createdAt: Date.now(),
    lastEvaluated: Date.now(),
    startCapitalEUR,
    cashEUR: 0,
    holdings,
    history: [{ ts: Date.now(), valueEUR: startCapitalEUR }]
  };
  return pf;
}

// Compute current portfolio value in EUR
function computePortfolioValue(pf) {
  let total = pf.cashEUR || 0;
  const positions = [];
  for (const u of UNIVERSE) {
    const h = pf.holdings[u.sym];
    if (!h || h.units <= 0) continue;
    const q = currentPrices[u.sym];
    const priceEUR = (q && q.price > 0) ? q.price / currentEURUSD : h.avgCostEUR;
    const valueEUR = h.units * priceEUR;
    const costEUR = h.units * h.avgCostEUR;
    const plEUR = valueEUR - costEUR;
    const plPct = costEUR > 0 ? (plEUR / costEUR) * 100 : 0;
    total += valueEUR;
    positions.push({
      ...u, units: h.units, priceEUR, valueEUR, costEUR, plEUR, plPct,
      changePct: q ? q.changePct : 0,
      targetAlloc: h.targetAlloc
    });
  }
  return { total, positions };
}

// Generate buy/sell suggestions by comparing current allocation vs target
function generateTrades(pf, valuation) {
  const trades = [];
  const total = valuation.total;
  if (total <= 0) return trades;

  for (const p of valuation.positions) {
    const currentWeight = p.valueEUR / total;
    const targetWeight = p.targetAlloc || 0;
    const driftPct = (currentWeight - targetWeight) * 100;
    const driftEUR = (currentWeight - targetWeight) * total;

    // Rebalancing threshold: 3 percentage points
    if (driftPct > 3) {
      trades.push({
        sym: p.sym, name: p.name, action: 'SELL',
        amountEUR: Math.abs(driftEUR),
        reason: `Übergewichtet (${(currentWeight*100).toFixed(0)}% statt ${(targetWeight*100).toFixed(0)}%). Teilverkauf zur Rückführung auf Zielallokation. Tagesänderung: ${p.changePct>=0?'+':''}${p.changePct.toFixed(1)}%.`
      });
    } else if (driftPct < -3) {
      trades.push({
        sym: p.sym, name: p.name, action: 'BUY',
        amountEUR: Math.abs(driftEUR),
        reason: `Untergewichtet (${(currentWeight*100).toFixed(0)}% statt ${(targetWeight*100).toFixed(0)}%). Nachkauf empfohlen. Tagesänderung: ${p.changePct>=0?'+':''}${p.changePct.toFixed(1)}%.`
      });
    } else {
      trades.push({
        sym: p.sym, name: p.name, action: 'HOLD',
        amountEUR: 0,
        reason: `Im Zielkorridor (${(currentWeight*100).toFixed(0)}%). Halten.`
      });
    }
  }
  // Sort: BUY/SELL first, HOLD last
  trades.sort((a,b) => {
    const order = { SELL: 0, BUY: 1, HOLD: 2 };
    return order[a.action] - order[b.action];
  });
  return trades;
}

// Apply trades: rebalance holdings to target allocation
function applyTrades() {
  const pf = getPortfolio();
  if (!pf) return;
  const valuation = computePortfolioValue(pf);
  const total = valuation.total;
  // Rebalance every holding to its target allocation at current prices
  for (const u of UNIVERSE) {
    const h = pf.holdings[u.sym];
    if (!h) continue;
    const q = currentPrices[u.sym];
    const priceEUR = (q && q.price > 0) ? q.price / currentEURUSD : h.avgCostEUR;
    if (priceEUR <= 0) continue;
    const targetValueEUR = total * (h.targetAlloc || 0);
    const newUnits = targetValueEUR / priceEUR;
    // Weighted-average cost basis update for added units; keep basis for reduced
    if (newUnits > h.units) {
      const addedUnits = newUnits - h.units;
      const totalCost = h.units * h.avgCostEUR + addedUnits * priceEUR;
      h.avgCostEUR = totalCost / newUnits;
    }
    h.units = newUnits;
  }
  pf.cashEUR = 0;
  pf.lastEvaluated = Date.now();
  pf.history.push({ ts: Date.now(), valueEUR: total });
  if (pf.history.length > 60) pf.history = pf.history.slice(-60);
  savePortfolio(pf);
  // Re-render
  renderPortfolio(pf);
  // brief visual feedback
  const btn = document.querySelector('.pf-btn-apply');
  if (btn) { const t = btn.textContent; btn.textContent = '✓ Gespeichert'; setTimeout(()=>btn.textContent=t, 1500); }
}

function resetPortfolio() {
  if (!confirm('Musterportfolio auf 10.000 € zurücksetzen? Der gespeicherte Verlauf geht verloren.')) return;
  const pf = createInitialPortfolio();
  savePortfolio(pf);
  renderPortfolio(pf);
}

// ── Main load ─────────────────────────────────────────
async function loadBrief() {
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.disabled = true;

  show('loading');
  const key = localStorage.getItem(KEY_STORAGE);
  if (!key) { show('key'); return; }
  const fhKey = localStorage.getItem(FINNHUB_KEY_STORAGE);

  try {
    // 1) Fetch REAL prices from Finnhub (if key present)
    let priceSourceLive = false;
    if (fhKey) {
      try {
        currentPrices = await fetchAllPrices(fhKey);
        priceSourceLive = Object.values(currentPrices).some(p => p && p.price > 0);
      } catch (e) {
        priceSourceLive = false;
      }
    }

    // 2) Fetch qualitative brief from Claude (cached 4h unless manual)
    let brief = (btn && btn._manualRefresh) ? null : getCached();
    if (!brief) {
      brief = await fetchBriefFromClaude(key);
      setCache(brief);
    }
    if (btn) btn._manualRefresh = false;

    // 3) Portfolio: create on first run, else load
    let pf = getPortfolio();
    if (!pf) {
      if (!priceSourceLive) {
        // Can't create portfolio without prices — use brief crypto/stock as fallback prices
        seedFallbackPrices(brief);
      }
      pf = createInitialPortfolio();
      savePortfolio(pf);
    }

    // 4) Render everything
    renderBrief(brief, priceSourceLive);
    renderPortfolio(pf, priceSourceLive);

    show('dash');
    window.scrollTo(0, 0);

  } catch (err) {
    const detail = [
      err.message || String(err),
      err.name ? 'Type: ' + err.name : '',
      'URL: ' + window.location.href.substring(0, 50)
    ].filter(Boolean).join('\n\n');
    document.getElementById('error-msg').textContent = detail;
    show('error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

// Fallback: if Finnhub unavailable, parse rough prices from Claude brief
function seedFallbackPrices(brief) {
  currentPrices = {};
  const parseNum = s => parseFloat(String(s).replace(/[^0-9.,]/g,'').replace('.','').replace(',','.')) || 0;
  // crypto from brief
  (brief.crypto||[]).forEach(c => {
    if (c.symbol.startsWith('BTC')) currentPrices['BTC'] = { price: parseNum(c.price), changePct: 0, prevClose: 0 };
    if (c.symbol.startsWith('ETH')) currentPrices['ETH'] = { price: parseNum(c.price), changePct: 0, prevClose: 0 };
  });
  // rough stock fallbacks (USD)
  currentPrices['NVDA'] = currentPrices['NVDA'] || { price: 140, changePct: 0, prevClose: 140 };
  currentPrices['MSFT'] = currentPrices['MSFT'] || { price: 430, changePct: 0, prevClose: 430 };
  currentPrices['VOO']  = currentPrices['VOO']  || { price: 540, changePct: 0, prevClose: 540 };
}

    <div class="stock-cell">
      <div class="stock-name">${esc(s.name)}</div>
      <div class="stock-chg ${s.isPositive ? 'pos' : 'neg'}">${esc(s.change)}</div>
    </div>`).join('');

  document.getElementById('macro-list').innerHTML = (b.macroFactors || []).map(m => `
    <li class="macro-item">
      <span class="macro-key">${esc(m.key)}</span>
      <span class="macro-val ${m.isNeutral ? 'neu' : m.isPositive ? 'pos' : 'neg'}">${esc(m.value)}</span>
    </li>`).join('');

  const topicCls = { positive:'tag-pos', negative:'tag-neg', neutral:'tag-neu' };
  document.getElementById('topics-cloud').innerHTML = (b.topTopics || []).map(t =>
    `<span class="tag ${topicCls[t.sentiment] || 'tag-neu'}">${esc(t.text)}</span>`).join('');
  document.getElementById('risks-cloud').innerHTML = (b.risks || []).map(r => `<span class="tag tag-neg">${esc(r)}</span>`).join('');
  document.getElementById('opps-cloud').innerHTML = (b.opportunities || []).map(o => `<span class="tag tag-pos">${esc(o)}</span>`).join('');
  document.getElementById('rec-text').innerHTML = b.recommendation || '—';
  document.getElementById('footer-updated').textContent = 'Aktualisiert: ' + new Date().toLocaleString('de-DE', { dateStyle:'short', timeStyle:'short' });

  const btn = document.getElementById('refresh-btn');
  if (btn) { btn._manualRefresh = false; btn.onclick = () => { btn._manualRefresh = true; loadBrief(); }; }
}

// ── Render: portfolio ─────────────────────────────────
const fmtEUR = v => v.toLocaleString('de-DE', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const fmtEUR2 = v => v.toLocaleString('de-DE', { style:'currency', currency:'EUR', maximumFractionDigits:2 });

function renderPortfolio(pf, priceSourceLive) {
  const val = computePortfolioValue(pf);
  const total = val.total;
  const startCap = pf.startCapitalEUR || 10000;
  const totalPL = total - startCap;
  const totalPLPct = (totalPL / startCap) * 100;

  // Hero
  document.getElementById('pf-value').textContent = fmtEUR2(total);
  const deltaEl = document.getElementById('pf-delta');
  const sign = totalPL >= 0 ? '+' : '';
  deltaEl.innerHTML = `
    <span class="pf-delta-abs ${totalPL>=0?'pos':'neg'}">${sign}${fmtEUR2(totalPL)}</span>
    <span class="${totalPL>=0?'pos':'neg'}">${sign}${totalPLPct.toFixed(2)}% seit Start</span>`;

  // Allocation bar
  const allocColors = { NVDA:'#76b900', MSFT:'#5b9cf6', VOO:'#c9a96e', BTC:'#f7931a', ETH:'#7b8cf0' };
  document.getElementById('pf-alloc').innerHTML = val.positions.map(p => {
    const w = total>0 ? (p.valueEUR/total*100) : 0;
    return `<div class="alloc-seg" style="width:${w}%;background:${allocColors[p.sym]||'var(--gold)'}"></div>`;
  }).join('');

  // Since / source
  const created = new Date(pf.createdAt).toLocaleDateString('de-DE', { day:'2-digit', month:'short', year:'numeric' });
  document.getElementById('pf-since').textContent = `Start: ${created}`;
  document.getElementById('pf-cash').textContent = priceSourceLive ? 'Kurse: Finnhub live' : 'Kurse: Schätzung';

  // Price source badge
  const srcBadge = document.getElementById('price-source');
  if (priceSourceLive) { srcBadge.textContent = '● LIVE'; srcBadge.className = 'src-badge'; }
  else { srcBadge.textContent = '● SCHÄTZUNG'; srcBadge.className = 'src-badge stale'; }
  srcBadge.style.marginLeft = 'auto';

  // Holdings
  document.getElementById('holdings-list').innerHTML = val.positions.map(p => {
    const plSign = p.plEUR >= 0 ? '+' : '';
    return `
    <div class="hold-row">
      <div class="hold-badge">${esc(p.badge)}</div>
      <div class="hold-mid">
        <div class="hold-name">${esc(p.name)}</div>
        <div class="hold-meta">${esc(p.cls)} · ${p.units.toFixed(p.units<1?4:2)} Einh.</div>
      </div>
      <div class="hold-right">
        <div class="hold-val">${fmtEUR2(p.valueEUR)}</div>
        <div class="hold-chg ${p.plEUR>=0?'pos':'neg'}">${plSign}${p.plPct.toFixed(1)}%</div>
      </div>
    </div>`;
  }).join('');

  // Trades
  pendingTrades = generateTrades(pf, val);
  const actionLabel = { BUY:'KAUFEN', SELL:'VERKAUF', HOLD:'HALTEN' };
  const actionCls = { BUY:'trade-buy', SELL:'trade-sell', HOLD:'trade-hold' };
  document.getElementById('trades-list').innerHTML = pendingTrades.map(t => `
    <div class="trade-row">
      <div class="trade-action ${actionCls[t.action]}">${actionLabel[t.action]}</div>
      <div class="trade-body">
        <div class="trade-title">${esc(t.name)}${t.amountEUR>0 ? ' · ~'+fmtEUR(t.amountEUR) : ''}</div>
        <div class="trade-reason">${esc(t.reason)}</div>
      </div>
    </div>`).join('');
}

// ── Manual refresh wiring ─────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.onclick = () => { btn._manualRefresh = true; loadBrief(); };
});

// ── Install banner ────────────────────────────────────
function maybeShowInstallBanner() {
  const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (isIOS && isSafari && !isStandalone && !localStorage.getItem('mb_install_dismissed')) {
    setTimeout(() => { document.getElementById('install-banner').style.display = 'block'; }, 3000);
  }
}
function dismissInstall() {
  document.getElementById('install-banner').style.display = 'none';
  localStorage.setItem('mb_install_dismissed', '1');
}

// ── Helpers ───────────────────────────────────────────
function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script></body>
</html>
